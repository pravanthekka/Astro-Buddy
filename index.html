<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AstroBuddy is a calm health-monitoring software prototype concept for astronauts on long-duration space missions.">
<meta property="og:image" content="https://pravanthekka.github.io/Astro-Buddy/preview.png">
<title>AstroBuddy – A Calm Health Companion for Astronauts</title>
<!-- AI-use note: parts of this code and wording were written with help from Claude (Anthropic). The concept, project direction and design decisions are the team's own. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#F1F2FF;--muted:#A6AEC9;--glass:rgba(13,16,32,.82);--edge:rgba(160,145,255,.22);--calm:#5EE0C4;--watch:#FFC857;--urgent:#FF716D;--lav:#A58BFF;--st:var(--calm)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.5;
background:radial-gradient(2px 2px at 12% 18%,rgba(255,255,255,.9),transparent),radial-gradient(1.5px 1.5px at 70% 12%,rgba(255,255,255,.8),transparent),radial-gradient(2px 2px at 86% 40%,rgba(190,190,255,.8),transparent),radial-gradient(1.5px 1.5px at 30% 70%,rgba(255,255,255,.7),transparent),radial-gradient(2px 2px at 55% 88%,rgba(190,190,255,.7),transparent),radial-gradient(1.5px 1.5px at 6% 82%,rgba(255,255,255,.8),transparent),radial-gradient(650px 400px at 85% -10%,rgba(112,78,190,.19),transparent),radial-gradient(550px 400px at -5% 100%,rgba(54,75,150,.15),transparent),linear-gradient(145deg,#03040A,#090B17 55%,#070812);background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 50px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
h1{font-size:1.9rem;font-weight:800;margin:0}
h1 small{display:block;font-size:.95rem;font-weight:400;color:var(--muted)}
h2{font-size:1.1rem;font-weight:800;margin:0 0 10px}
a{color:var(--calm)}
a:hover{color:#fff}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:20px;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.25);margin-bottom:16px}
.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
button{font:inherit;color:var(--ink);cursor:pointer;border-radius:999px;border:1.5px solid var(--edge);background:var(--glass);padding:8px 14px}
button:hover{border-color:var(--lav)}
button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
button[aria-pressed="true"]{background:var(--lav);color:#12163F;border-color:var(--lav);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.band{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.92rem;margin-bottom:14px}
.live{width:10px;height:10px;border-radius:50%;background:var(--calm);box-shadow:0 0 0 0 var(--calm);animation:pu 2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(94,224,196,.6)}100%{box-shadow:0 0 0 12px rgba(94,224,196,0)}}
